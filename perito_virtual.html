    function syncValuViewport() {

        if (!valuExperience) {
            return;
        }


        const viewport =
            window.visualViewport;


        const height =
            viewport
                ? viewport.height
                : window.innerHeight;


        const width =
            viewport
                ? viewport.width
                : window.innerWidth;


        valuExperience.style.setProperty(
            "--valu-mobile-vh",
            Math.max(
                240,
                Math.round(height)
            ) + "px"
        );


        valuExperience.style.setProperty(
            "--valu-mobile-vw",
            Math.max(
                240,
                Math.round(width)
            ) + "px"
        );

    }


    syncValuViewport();


    window.addEventListener(
        "resize",
        syncValuViewport,
        { passive: true }
    );


    window.addEventListener(
        "orientationchange",
        function () {

            syncValuViewport();

            setTimeout(
                syncValuViewport,
                120
            );

            setTimeout(

                420
            );

    if (window.visualViewport) {

    /* =========================================================

    function wait(ms) {

        return new Promise(
            resolve =>
                setTimeout(
                    resolve,
                    ms
                )
        );

    }


    function clamp(
        value,
        min,
        max
    ) {

        return Math.min(
            max,
            Math.max(
                min,
                value
            )
        );

    }


    function normalizeText(value) {

        return String(
            value || ""
        )
        .normalize("NFD")
        .replace(
            /[\u0300-\u036f]/g,
            ""
        )
        .toLowerCase()
        .replace(
            /[¿?]/g,
            ""
        )
        .replace(
            /\s+/g,
            " "
        )
        .trim();

    }


    function preloadImages(
        images
    ) {

        return Promise.all(

            images.map(
                image => {

                    if (
                        !image ||
                        (
                            image.complete &&
                            image.naturalWidth >
                                0
                        )
                    ) {

                        return Promise.resolve();

                    }


                    return new Promise(
                        resolve => {

                            image.addEventListener(
                                "load",
                                resolve,
                                {
                                    once:
                                        true
                                }
                            );

                            image.addEventListener(
                                "error",
                                resolve,
                                {
                                    once:
                                        true
                                }
                            );

                        }
                    );

                }
            )

        );

    }


    function clearBubbleTimer() {

    /* =========================================================
       AUDIO
       ========================================================= */

    async function unlockVoice() {

        try {

            voicePlayer.src =
                introMessages[0].audio;

            voicePlayer.volume =
                0;


            await voicePlayer.play();


            voicePlayer.pause();

            voicePlayer.currentTime =
                0;

            voicePlayer.volume =
                1;

        }

        catch (error) {

            voicePlayer.volume =
                1;

        }

    }


    function stopVoice() {

        voicePlayer.pause();

        try {

            voicePlayer.currentTime =
                0;

        }

        catch (error) {
            /* El audio todavía puede no tener metadata cargada. */
        }


        /*
           Si una narración estaba esperando el evento "ended", la
           resolvemos también al adelantar manualmente. Así nunca queda
           una promesa antigua bloqueando la introducción.
        */
        if (activeVoiceResolve) {

            const resolveVoice =
                activeVoiceResolve;

            activeVoiceResolve =
                null;

            resolveVoice();

        }

    }

    function getAudioDuration(
        url
    ) {

        return new Promise(
            resolve => {

                if (!url) {

                    resolve(
                        0
                    );

                    return;

                }


                stopVoice();


                voicePlayer.src =
                    url;

                voicePlayer.load();


                const done =
                    function () {

                        voicePlayer.removeEventListener(
                            "loadedmetadata",
                            done
                        );


                        resolve(
                            isFinite(
                                voicePlayer.duration
                            )
                                ?
                                voicePlayer.duration *
                                1000
                                :
                                0
                        );

                    };


                voicePlayer.addEventListener(
                    "loadedmetadata",
                    done,
                    {
                        once:
                            true
                    }
                );


                voicePlayer.addEventListener(
                    "error",
                    function () {

                        resolve(
                            0
                        );

                    },
                    {
                        once:
                            true
                    }
                );

            }
        );

    }


    function playVoice(
        url
    ) {

        return new Promise(
            async resolve => {

                if (!url) {

                    resolve();

                    return;

                }


                stopVoice();


                voicePlayer.src =
                    url;

                voicePlayer.currentTime =
                    0;

                voicePlayer.volume =
                    1;


                let settled =
                    false;


                const done =
                    function () {

                        if (settled) {
                            return;
                        }

                        settled =
                            true;


                        voicePlayer.removeEventListener(
                            "ended",
                            done
                        );

                        voicePlayer.removeEventListener(
                            "error",
                            done
                        );


                        if (
                            activeVoiceResolve ===
                            done
                        ) {

                            activeVoiceResolve =
                                null;

                        }


                        resolve();

                    };


                activeVoiceResolve =
                    done;


                voicePlayer.addEventListener(
                    "ended",
                    done
                );

                voicePlayer.addEventListener(
                    "error",
                    done
                );


                try {

                    await voicePlayer.play();

                }

                catch (error) {

                    done();

                }

            }
        );

    }

    async function typeBubble(
        bubble,
        text,
        duration,
        runId,
        messageRunId
    ) {

        const textElement =
            bubble.querySelector(
                ".bubble-text"
            );


        textElement.textContent =
            "";


        bubble.classList.add(
            "visible"
        );


        bubble
            .querySelectorAll(
                ".valu-cursor"
            )
            .forEach(
                cursor =>
                    cursor.remove()
            );


        const cursor =
            document.createElement(
                "span"
            );


        cursor.className =
            "valu-cursor";


        bubble.appendChild(
            cursor
        );


        const usableDuration =
            Math.max(
                duration * .86,
                1100
            );


        const speed =
            usableDuration /
            Math.max(
                text.length,
                1
            );


        for (
            let i = 0;
            i < text.length;
            i++
        ) {

            if (
                mode !==
                    "intro" ||
                runId !==
                    introRunId ||
                messageRunId !==
                    introMessageRunId
            ) {

                cursor.remove();

                return;

            }


            textElement.textContent +=
                text.charAt(
                    i
                );


            await wait(
                speed
            );

        }


        cursor.remove();

    }


    function completeIntroBubble(
        index

        const message =
            introMessages[index];


        if (!message) {
            return;

        const textElement =

    function revealIntroStart(

    ) {

        if (
            mode !==
                "intro" ||
            runId !==
                introRunId
        ) {

        introMessageRunId++;

        stopVoice();


        if (
            introMessageIndex >=

            introMessageIndex <

        ) {

            );

        ) {

                    startButton.scrollIntoView({

    async function showIntroMessage(
        index,
        runId
    ) {

        if (
            mode !==
                "intro" ||
            runId !==
                introRunId
        ) {
            return;
        }


        if (
            index >=
            introMessages.length
        ) {

            revealIntroStart(
                runId
            );

            return;

        }


        const messageRunId =
            ++introMessageRunId;


        stopVoice();


        introMessageIndex =
            index;


        const message =
            introMessages[index];


        showPose(
            message.pose
        );

        setGesture(
            message.gesture
        );


        introNext.classList.add(
            "visible"
        );


        await wait(
            90
        );


        if (
            mode !==
                "intro" ||
            runId !==
                introRunId ||
            messageRunId !==
                introMessageRunId
        ) {
            return;
        }


        const duration =
            await getAudioDuration(
                message.audio
            );


        if (
            mode !==
                "intro" ||
            runId !==
                introRunId ||
            messageRunId !==
                introMessageRunId
        ) {
            return;
        }


        await Promise.all([

            playVoice(
                message.audio
            ),

            typeBubble(
                message.bubble,
                message.text,
                duration ||
                    Math.max(
                        message.text.length *
                            52,
                        1600
                    ),
                runId,
                messageRunId
            )

        ]);


        if (
            mode !==
                "intro" ||
            runId !==
                introRunId ||
            messageRunId !==
                introMessageRunId ||
            introMessageIndex !==
                index
        ) {
            return;
        }


        await wait(
            230
        );


        if (
            mode !==
                "intro" ||
            runId !==
                introRunId ||
            messageRunId !==
                introMessageRunId ||
            introMessageIndex !==
                index
        ) {
            return;
        }


        showIntroMessage(
            index + 1,
            runId
        );

    }


    function advanceIntroMessage() {

        if (
            mode !==
                "intro"
        ) {
            return;
        }


        /*
           Completa inmediatamente el texto que esté escribiéndose,
           detiene su audio y avanza un solo mensaje por cada clic.
        */
        if (
            introMessageIndex >=
                0 &&
            introMessageIndex <
                introMessages.length
        ) {

            completeIntroBubble(
                introMessageIndex
            );

        }


        introMessageRunId++;

        stopVoice();


        if (
            introMessageIndex <
                0
        ) {

            showIntroMessage(
                0,
                introRunId
            );

            return;

        }


        if (
            introMessageIndex >=
                introMessages.length -
                1
        ) {

            revealIntroStart(
                introRunId
            );

            return;

        }


        showIntroMessage(
            introMessageIndex +
                1,
            introRunId
        );

    }

    /* =========================================================
       ACCESO SAME-ORIGIN A PERITO
       ========================================================= */

    function getPeritoContext() {

        try {

            const doc =
                frame.contentDocument;

            const win =
                frame.contentWindow;


            if (
                !doc ||
                !win ||
                !doc.body
            ) {

                return null;

            }


            /*
               Esta lectura solo funciona si realmente
               estamos bajo el mismo origen.
            */

            void doc.body.innerHTML;


            return {
                doc:
                    doc,

                win:
                    win
            };

        }

        catch (error) {

            console.error(
                "Valu: el iframe no quedó same-origin.",
                error
            );


            return null;

        }

    }


    function isVisibleInside(
        element,
        win
    ) {

        if (!element) {
            return false;
        }


        const rect =
            element.getBoundingClientRect();


        const style =
            win.getComputedStyle(
                element
            );


        return (
            rect.width > 0 &&
            rect.height > 0 &&
            style.display !==
                "none" &&
            style.visibility !==
                "hidden"
        );

    }


    function findBestTextElement(
        doc,
        win,
        searchText
    ) {

        const needle =
            normalizeText(
                searchText
            );


        const selectors =
            [
                "h1",
                "h2",
                "h3",
                "h4",
                "h5",
                "h6",
                "label",
                "legend",
                "button",
                "p",
                "span",
                "div"
            ].join(",");


        const matches =
            Array.from(
                doc.querySelectorAll(
                    selectors
                )
            )
            .filter(
                element => {

                    if (
                        !isVisibleInside(
                            element,
                            win
                        )
                    ) {
                        return false;
                    }


                    const text =
                        normalizeText(
                            element.textContent
                        );


                    return (
                        text &&
                        text.includes(
                            needle
                        )
                    );

                }
            )
            .sort(
                (a, b) => {

                    const aText =
                        normalizeText(
                            a.textContent
                        );

                    const bText =
                        normalizeText(
                            b.textContent
                        );


                    /*
                       Preferimos el elemento cuyo texto
                       sea más corto/específico.
                    */

                    return (
                        aText.length -
                        bText.length
                    );

                }
            );


        return (
            matches[0] ||
            null
        );

    }


    function findFieldBlock(
        anchor,
        win
    ) {

        if (!anchor) {
            return null;
        }


        /*
           Si es label con "for", arrancamos por
           el control asociado.
        */

        let control =
            null;


        if (
            anchor.tagName ===
                "LABEL" &&
            anchor.htmlFor
        ) {

            control =
                anchor.ownerDocument
                    .getElementById(
                        anchor.htmlFor
                    );

        }


        let node =
            control
                ?
                control.parentElement
                :
                anchor.parentElement;


        let fallback =
            anchor;


        for (
            let i = 0;
            i < 7 &&
            node;
            i++
        ) {

            const rect =
                node.getBoundingClientRect();


            const controls =
                Array.from(
                    node.querySelectorAll(
                        "input, select, textarea, button"
                    )
                )
                .filter(
                    item =>
                        isVisibleInside(
                            item,
                            win
                        )
                );


            if (
                controls.length >=
                    1 &&
                rect.width >=
                    150 &&
                rect.height >=
                    38 &&
                rect.height <=
                    360
            ) {

                return node;

            }


            if (
                rect.width >=
                    150 &&
                rect.height >=
                    30 &&
                rect.height <=
                    420
            ) {

                fallback =
                    node;

            }


            node =
                node.parentElement;

        }


        return fallback;

    }


    function findSectionBlock(
        anchor,
        win
    ) {

        if (!anchor) {
            return null;
        }


        let node =
            anchor.parentElement;


        let fallback =
            anchor.parentElement ||
            anchor;


        for (
            let i = 0;
            i < 9 &&
            node;
            i++
        ) {

            const rect =
                node.getBoundingClientRect();


            const controls =
                Array.from(
                    node.querySelectorAll(
                        "input, select, textarea, button"
                    )
                )
                .filter(
                    item =>
                        isVisibleInside(
                            item,
                            win
                        )
                );


            /*
               Elegimos el PRIMER contenedor amplio
               que contiene varios controles.
            */

            if (
                controls.length >=
                    3 &&
                rect.width >=
                    win.innerWidth *
                    .45 &&
                rect.height >=
                    260 &&
                rect.height <=
                    1350
            ) {

                return node;

            }


            if (
                rect.width >=
                    win.innerWidth *
                    .4 &&
                rect.height >=
                    220
            ) {

                fallback =
                    node;

            }


            node =
                node.parentElement;

        }


        return fallback;

    }


    function uniqueElements(
        elements
    ) {

        return Array.from(
            new Set(
                elements.filter(
                    Boolean
                )
            )
        );

    }


    function resolveStepElements(
        step
    ) {

        if (
            !peritoDocument ||
            !peritoWindow
        ) {

            return null;

        }


        const elements =
            [];


        for (
            const anchorText
            of step.anchors
        ) {

            const anchor =
                findBestTextElement(
                    peritoDocument,
                    peritoWindow,
                    anchorText
                );


            if (!anchor) {

                console.warn(
                    "Valu no encontró:",
                    anchorText
                );


                continue;

            }


            const target =
                step.mode ===
                    "section"
                    ?
                    findSectionBlock(
                        anchor,
                        peritoWindow
                    )
                    :
                    findFieldBlock(
                        anchor,
                        peritoWindow
                    );


            elements.push(
                target ||
                anchor
            );

        }


        const actionElements =
            [];


        if (
            step.actionAnchors
        ) {

            for (
                const anchorText
                of step.actionAnchors
            ) {

                const anchor =
                    findBestTextElement(
                        peritoDocument,
                        peritoWindow,
                        anchorText
                    );


                if (anchor) {

                    actionElements.push(
                        anchor
                    );

                }

            }

        }


        return {
            elements:
                uniqueElements(
                    elements
                ),

            actionElements:
                uniqueElements(
                    actionElements
                )
        };

    }


    function getUnionDocumentRect(
        elements,
        win
    ) {

        const rects =
            elements
            .map(
                element =>
                    element.getBoundingClientRect()
            )
            .filter(
                rect =>
                    rect.width >
                        0 &&
                    rect.height >
                        0
            );


        if (
            !rects.length
        ) {

            return null;

        }


        const left =
            Math.min(
                ...rects.map(
                    rect =>
                        rect.left
                )
            ) +
            win.scrollX;


        const top =
            Math.min(
                ...rects.map(
                    rect =>
                        rect.top
                )
            ) +
            win.scrollY;


        const right =
            Math.max(
                ...rects.map(
                    rect =>
                        rect.right
                )
            ) +
            win.scrollX;


        const bottom =
            Math.max(
                ...rects.map(
                    rect =>
                        rect.bottom
                )
            ) +
            win.scrollY;


        return {
            left:
                left,

            top:
                top,

            right:
                right,

            bottom:
                bottom,

            width:
                right -
                left,

            height:
                bottom -
                top
        };

    }


    /* =========================================================
       OVERLAY REAL DENTRO DE PERITO VIRTUAL
       ========================================================= */

    function ensurePeritoGuideLayer() {

        if (
            !peritoDocument
        ) {
            return null;
        }


        let style =
            peritoDocument
                .getElementById(
                    "valu-guide-style"
                );


        if (!style) {

            style =
                peritoDocument
                    .createElement(
                        "style"
                    );


            style.id =
                "valu-guide-style";


            style.textContent =
                `
                #valu-guide-focus,
                #valu-guide-action {
                    position: absolute;
                    pointer-events: none;
                    opacity: 0;
                    z-index: 2147483646;
                    box-sizing: border-box;
                    /*
                       No animamos left/top/width/height. Así el marco nunca
                       interpola entre dos zonas cuando hay clics consecutivos.
                    */
                    transition:
                        opacity .16s ease;
                }

                #valu-guide-focus {
                    border:
                        3px solid
                        rgba(32, 201, 181, .98);

                    border-radius:
                        24px;

                    background:
                        rgba(32, 201, 181, .025);

                    box-shadow:
                        0 0 0 9999px
                        rgba(2, 9, 18, .20),

                        0 0 0 7px
                        rgba(32, 201, 181, .08),

                        0 0 36px
                        rgba(32, 201, 181, .34);
                }

                #valu-guide-action {
                    border:
                        3px solid
                        rgba(115, 230, 255, .98);

                    border-radius:
                        14px;

                    background:
                        rgba(115, 230, 255, .055);

                    box-shadow:
                        0 0 0 5px
                        rgba(115, 230, 255, .11),

                        0 0 30px
                        rgba(115, 230, 255, .42);

                    animation:
                        valuGuidePulse
                        1.25s
                        ease-in-out
                        infinite;
                }

                #valu-guide-focus.valu-show,
                #valu-guide-action.valu-show {
                    opacity: 1;
                }

                @keyframes valuGuidePulse {

                    0%,
                    100% {
                        transform:
                            scale(1);
                    }

                    50% {
                        transform:
                            scale(1.015);

                        box-shadow:
                            0 0 0 9px
                            rgba(115, 230, 255, .12),

                            0 0 34px
                            rgba(115, 230, 255, .48);
                    }

                }
                `;


            peritoDocument.head
                .appendChild(
                    style
                );

        }


        let focus =
            peritoDocument
                .getElementById(
                    "valu-guide-focus"
                );


        if (!focus) {

            focus =
                peritoDocument
                    .createElement(
                        "div"
                    );


            focus.id =
                "valu-guide-focus";


            peritoDocument.body
                .appendChild(
                    focus
                );

        }


        let action =
            peritoDocument
                .getElementById(
                    "valu-guide-action"
                );


        if (!action) {

            action =
                peritoDocument
                    .createElement(
                        "div"
                    );


            action.id =
                "valu-guide-action";


            peritoDocument.body
                .appendChild(
                    action
                );

        }


        return {
            focus:
                focus,

            action:
                action
        };

    }


    function setOverlayRect(
        element,
        rect,
        padding
    ) {

        if (
            !element ||
            !rect
        ) {
            return;
        }


        const p =
            padding ||
            0;


        element.style.left =
            (
                rect.left -
                p
            ) +
            "px";


        element.style.top =
            (
                rect.top -
                p
            ) +
            "px";


        element.style.width =
            (
                rect.width +
                p * 2
            ) +
            "px";


        element.style.height =
            (
                rect.height +
                p * 2
            ) +
            "px";

    }


    function hidePeritoHighlight() {

        if (!peritoDocument) {
            return;
        }


        const focus =
            peritoDocument
                .getElementById(
                    "valu-guide-focus"
                );


        const action =
            peritoDocument
                .getElementById(
                    "valu-guide-action"
                );


        if (focus) {

            focus.classList.remove(
                "valu-show"
            );

        }


        if (action) {

            action.classList.remove(
                "valu-show"
            );

        }

    }


    function showPeritoHighlight(
        step
    ) {

        const resolved =
            resolveStepElements(
                step
            );


        if (
            !resolved ||
            !resolved.elements.length
        ) {

            return null;

        }


        const layer =
            ensurePeritoGuideLayer();


        if (!layer) {

            return null;

        }


        const focusRect =
            getUnionDocumentRect(
                resolved.elements,
                peritoWindow
            );


        if (!focusRect) {

            return null;

        }


        /*
           Reposicionamos el cuadro mientras está oculto y sin transición
           geométrica. Así, al saltar rápido entre pasos, el marco no
           "viaja" por la pantalla ni queda interpolando una zona anterior.
        */
        layer.focus.classList.remove(
            "valu-show"
        );

        layer.focus.style.transition =
            "none";


        setOverlayRect(
            layer.focus,
            focusRect,
            15
        );


        void layer.focus.offsetWidth;

        layer.focus.style.transition =
            "";


        layer.focus.classList.add(
            "valu-show"
        );


        layer.action.classList.remove(
            "valu-show"
        );


        if (
            resolved.actionElements.length
        ) {

            const actionRect =
                getUnionDocumentRect(
                    resolved.actionElements,
                    peritoWindow
                );


            if (actionRect) {

                layer.action.style.transition =
                    "none";


                setOverlayRect(
                    layer.action,
                    actionRect,
                    8
                );


                void layer.action.offsetWidth;

                layer.action.style.transition =
                    "";


                layer.action.classList.add(
                    "valu-show"
                );

            }

        }


        return focusRect;

    }


    /* =========================================================
       SCROLL REAL DE PERITO VIRTUAL
       ========================================================= */

    function scrollPeritoToRect(
        rect
    ) {

        if (
            !rect ||
            !peritoWindow
        ) {
            return;
        }


        const viewportHeight =
            peritoWindow.innerHeight;


        let targetTop;


        if (
            rect.height >=
            viewportHeight *
            .72
        ) {

            targetTop =
                rect.top -
                72;

        }

        else {

            targetTop =
                rect.top +
                rect.height /
                2 -
                viewportHeight /
                2;

        }


        const maxScroll =
            Math.max(
                0,
                peritoDocument
                    .documentElement
                    .scrollHeight -
                viewportHeight
            );


        targetTop =
            clamp(
                targetTop,
                0,
                maxScroll
            );


        /*
           IMPORTANTE: el tour usa desplazamiento inmediato.
           Un scroll suave puede seguir ejecutándose aunque el usuario
           pulse “Siguiente” varias veces y deja el marco entre dos pasos.
           Al usar auto, cada clic reemplaza de forma determinista al anterior.
        */
        peritoWindow.scrollTo({
            top:
                targetTop,

            left:
                0,

            behavior:
                "auto"
        });

    }


    async function focusCurrentStep(
        step,
        expectedTourRun,
        expectedStepIndex
    ) {

        const thisFocusRun =
            ++guideFocusRunId;


        hidePeritoHighlight();


        const resolved =
            resolveStepElements(
                step
            );


        if (
            !resolved ||
            !resolved.elements.length
        ) {

            return false;

        }


        const focusRect =
            getUnionDocumentRect(
                resolved.elements,
                peritoWindow
            );


        if (!focusRect) {

            return false;

        }


        /*
           Para las secciones 3 y 4 usamos el título REAL únicamente
           como destino de scroll. El rectángulo de resaltado se calcula
           por separado con los campos reales. Esto evita que un contenedor
           padre demasiado grande cambie el destino del desplazamiento.
        */
        let scrollRect =
            focusRect;


        if (
            step.scrollAnchor
        ) {

            const scrollAnchorElement =
                findBestTextElement(
                    peritoDocument,
                    peritoWindow,
                    step.scrollAnchor
                );


            if (scrollAnchorElement) {

                const anchorRect =
                    scrollAnchorElement
                        .getBoundingClientRect();


                scrollRect =
                    {
                        left:
                            anchorRect.left +
                            peritoWindow.scrollX,

                        top:
                            anchorRect.top +
                            peritoWindow.scrollY,

                        right:
                            anchorRect.right +
                            peritoWindow.scrollX,

                        bottom:
                            anchorRect.bottom +
                            peritoWindow.scrollY,

                        width:
                            anchorRect.width,

                        height:
                            Math.max(
                                anchorRect.height,
                                60
                            )
                    };

            }

        }


        /*
           Cancela cualquier desplazamiento suave anterior antes de
           iniciar el del paso más reciente.
        */
        try {

            peritoWindow.scrollTo({
                top:
                    peritoWindow.scrollY,

                left:
                    0,

                behavior:
                    "auto"
            });

        }

        catch (error) {
            /* Navegadores antiguos: no requiere acción. */
        }


        scrollPeritoToRect(
            scrollRect
        );


        /*
           Esperamos únicamente a que el navegador confirme dos frames
           de renderizado. No dejamos temporizadores largos pendientes:
           eso era lo que permitía que un paso antiguo reapareciera después
           de varios clics rápidos.
        */
        await new Promise(
            function (resolve) {

                const raf =
                    peritoWindow.requestAnimationFrame
                        ? peritoWindow.requestAnimationFrame.bind(peritoWindow)
                        : window.requestAnimationFrame.bind(window);

                raf(
                    function () {
                        raf(resolve);
                    }
                );

            }
        );


        /*
           Si el usuario hizo varios clics rápidos, cualquier enfoque
           anterior queda invalidado y NO puede volver a dibujar el
           rectángulo verde sobre una sección vieja.
        */
        if (
            mode !==
                "perito" ||
            thisFocusRun !==
                guideFocusRunId ||
            (
                typeof expectedTourRun ===
                    "number" &&
                expectedTourRun !==
                    tourRunId
            ) ||
            (
                typeof expectedStepIndex ===
                    "number" &&
                expectedStepIndex !==
                    currentStepIndex
            )
        ) {

            return false;

        }


        /*
           El paso 1 conserva el desplazamiento y el globo de Valu,
           pero NO dibuja ningún recuadro ni línea sobre Perito Virtual.
           Los demás pasos mantienen su resaltado normal.
        */
        if (
            step.highlight ===
                false
        ) {

            hidePeritoHighlight();

            return true;

        }


        showPeritoHighlight(
            step
        );


        return true;

    }


    /* =========================================================
       ESPERAR A QUE LA APP INTERNA TERMINE DE RENDERIZAR
       ========================================================= */

    async function waitForPeritoReady() {

        for (
            let attempt = 0;
            attempt < 40;
            attempt++
        ) {

            const context =
                getPeritoContext();


            if (context) {

                peritoDocument =
                    context.doc;

                peritoWindow =
                    context.win;


                const heading =
                    findBestTextElement(
                        peritoDocument,
                        peritoWindow,
                        "Ubicación Geográfica y Contexto"
                    );


                if (heading) {

                    ensurePeritoGuideLayer();


                    return true;

                }

            }


            await wait(
                250
            );

        }


        return false;

    }


    /* =========================================================
       VISIBILIDAD DE VALU Y MODOS DE GUÍA
       ========================================================= */

    function hideCoachCompletely() {

        clearBubbleTimer();

        coachBubble.classList.remove(
            "visible"
        );

        coach.classList.remove(
            "visible"
        );

        hidePeritoHighlight();

    }


    function hideCoachBubbleOnly() {

        coachBubble.classList.remove(
            "visible"
        );

        hidePeritoHighlight();

        /*
           La cabeza SE QUEDA flotando para que el usuario pueda
           volver a abrir la guía en modo lectura.
        */
        coach.classList.add(
            "visible"
        );

        showHead(
            "c1"
        );

    }


    function finishNarratedGuide() {

        guideFinished =
            true;

        guideMode =
            "review";

        stopVoice();

        hideCoachBubbleOnly();

        /*
           Al tocar la cabeza después de terminar, la revisión
           comienza nuevamente en el mensaje 1, SIN voz.
        */
        currentStepIndex =
            0;
        headButton.setAttribute(
            "aria-label",
            "Volver a abrir la guía"
        );

    }

    function prepareCoachUI(
        step,
        index,
        review
    ) {

        coachStepLabel.textContent =
            review
                ?
                step.label +
                " · Revisión"
                :
                step.label;


        coachText.textContent =
            step.text;


        coachPrev.disabled =
            index ===
            0;


        coachNext.textContent =
            index ===
                tutorialSteps.length -
                1
                ?
                (review
                    ?
                    "Cerrar"
                    :
                    "Listo")
                :
                "Siguiente";


        /*
           La guía dentro de Perito Virtual es ahora únicamente visual.
           La voz de la introducción de Valu se conserva.
        */
        coach.classList.add(
            "visible"
        );


        coachBubble.classList.add(
            "visible"
        );


        syncValuViewport();


        /* Cada paso de la guía empieza mostrando su encabezado. */
        coachBubble.scrollTop =
            0;

    }


    /* =========================================================
       RECORRIDO GUIADO · SIN VOZ
       Valu permanece visible durante los 6 mensajes.
       El usuario avanza manualmente con "Siguiente".
       ========================================================= */

    async function showNarratedStep(
        index
    ) {

        if (
            mode !==
                "perito" ||
            index < 0 ||
            index >=
                tutorialSteps.length
        ) {
            return;
        }


        guideMode =
            "narrated";

        guideFinished =
            false;


        const thisTourRun =
            tourRunId;


        clearBubbleTimer();

        /*
           Importante:
           la voz de la INTRO de Valu se conserva, pero la guía flotante
           dentro de Perito Virtual ya no reproduce ningún audio.
        */
        stopVoice();

        hidePeritoHighlight();


        currentStepIndex =
            index;


        const step =
            tutorialSteps[
                index
            ];


        /*
           Valu y el globo permanecen visibles. El avance es manual:
           el usuario decide cuándo pasar con "Siguiente".
        */
        prepareCoachUI(
            step,
            index,
            false
        );


        animateHead(
            step.head
        );


        await focusCurrentStep(
            step,
            thisTourRun,
            index
        );


        if (
            mode !==
                "perito" ||
            thisTourRun !==
                tourRunId ||
            currentStepIndex !==
                index
        ) {
            return;
        }

    }


    /* =========================================================
       REVISIÓN SOLO LECTURA
       Sin audio y sin avance automático.
       ========================================================= */

    async function showReviewStep(
        index
    ) {

        if (
            mode !==
                "perito" ||
            index < 0 ||
            index >=
                tutorialSteps.length
        ) {
            return;
        }


        guideMode =
            "review";

        guideFinished =
            true;


        tourRunId++;

        const thisTourRun =
            tourRunId;

        stopVoice();

        clearBubbleTimer();

        hidePeritoHighlight();


        currentStepIndex =
            index;


        const step =
            tutorialSteps[
                index
            ];


        prepareCoachUI(
            step,
            index,
            true
        );


        animateHead(
            step.head
        );


        await focusCurrentStep(
            step,
            thisTourRun,
            index
        );

    }


    /* =========================================================
       CONTROLES MANUALES
       ========================================================= */

    coachPrev.addEventListener(
        "click",
        function () {

            /* Mata inmediatamente cualquier enfoque todavía pendiente. */
            guideFocusRunId++;
            hidePeritoHighlight();

            if (
                guideMode ===
                "review"
            ) {

                showReviewStep(
                    currentStepIndex -
                    1
                );

                return;

            }


            tourRunId++;


            showNarratedStep(
                Math.max(
                    0,
                    currentStepIndex -
                    1
                )
            );

        }
    );


    coachNext.addEventListener(
        "click",
        function () {

            /*
               El último clic siempre gana. Si el usuario pulsa muy rápido,
               ningún render anterior conserva permiso para pintar el marco.
            */
            guideFocusRunId++;
            hidePeritoHighlight();

            if (
                guideMode ===
                "review"
            ) {

                if (
                    currentStepIndex ===
                    tutorialSteps.length -
                    1
                ) {

                    hideCoachBubbleOnly();

                    return;

                }


                showReviewStep(
                    currentStepIndex +
                    1
                );

                return;

            }


            tourRunId++;

            stopVoice();


            if (
                currentStepIndex ===
                tutorialSteps.length -
                1
            ) {

                finishNarratedGuide();

                return;

            }


            showNarratedStep(
                currentStepIndex +
                1
            );

        }
    );


    coachClose.addEventListener(
        "click",
        function () {

            /*
               Cerrar la guía invalida de inmediato cualquier scroll o
               resaltado pendiente. Así nunca queda una línea/recuadro
               flotando sobre Perito Virtual al continuar por cuenta propia.
            */
            guideFocusRunId++;
            tourRunId++;

            stopVoice();
            hidePeritoHighlight();


            if (
                guideMode ===
                "review"
            ) {

                hideCoachBubbleOnly();

                return;

            }


            guideFinished =
                true;

            guideMode =
                "review";

            currentStepIndex =
                0;


            hideCoachBubbleOnly();


            headButton.setAttribute(
                "aria-label",
                "Volver a abrir la guía"
            );

        }
    );
    headButton.addEventListener(
        "click",
        function () {

            /*
               Una vez terminada la guía, tocar la cabeza abre el
               recorrido completo en modo SOLO LECTURA.
            */
            if (
                guideFinished ||
                guideMode ===
                    "review"
            ) {

                if (
                    coachBubble.classList.contains(
                        "visible"
                    )
                ) {

                    hideCoachBubbleOnly();

                    return;

                }


                showReviewStep(
                    0
                );

            }

        }
    );


    /* =========================================================
       ENTRAR A PERITO
       ========================================================= */

    function enterPerito() {

        mode =
            "perito";


        introRunId++;

        tourRunId++;

        guideFocusRunId++;


        stopVoice();


        intro.classList.add(
            "valu-intro-leaving"
        );


        loading.classList.remove(
            "hidden"
        );


        firstGuideShown =
            false;

        guideMode =
            "narrated";

        guideFinished =
            false;


        peritoDocument =
            null;

        peritoWindow =
            null;


        frame.src =
            PERITO_URL;


        setTimeout(
            function () {

                if (
                    mode !==
                    "perito"
                ) {
                    return;
                }


                intro.hidden =
                    true;


                peritoStage.hidden =
                    false;


                requestAnimationFrame(
                    function () {

                        peritoStage.classList.add(
                            "active"
                        );

                    }
                );

            },
            360
        );

    }


    introNext.addEventListener(
        "click",
        advanceIntroMessage
    );


    startButton.addEventListener(
        "click",
        enterPerito
    );


    /* =========================================================
       IFRAME CARGADO
       ========================================================= */

    frame.addEventListener(
        "load",
        async function () {

            if (
                mode !==
                "perito"
            ) {
                return;
            }


            const ready =
                await waitForPeritoReady();


            loading.classList.add(
                "hidden"
            );


            if (
                !ready
            ) {

                console.error(
                    "Valu no pudo localizar el formulario dentro de /perito-integrado/."
                );


                return;

            }


            if (
                !firstGuideShown
            ) {

                firstGuideShown =
                    true;


                tourRunId++;


                setTimeout(
                    function () {

                        showNarratedStep(
                            0
                        );

                    },
                    450
                );

            }

        }
    );


    /* =========================================================
       VOLVER AL INICIO
       ========================================================= */

    function returnToWelcome() {

        mode =
            "welcome";


        introRunId++;

        tourRunId++;


        stopVoice();

        clearBubbleTimer();

        hideCoachCompletely();

        resetIntroVisuals();


        intro.hidden =
            true;


        peritoStage.classList.remove(
            "active"
        );


        peritoStage.hidden =
            true;


        currentStepIndex =
            0;

        guideMode =
            "narrated";

        guideFinished =
            false;


        showHead(
            "c1"
        );


        peritoDocument =
            null;

        peritoWindow =
            null;


        loading.classList.remove(
            "hidden"
        );


        frame.src =
            "about:blank";


        welcome.hidden =
            false;

    }


    resetNow.addEventListener(
        "click",
        returnToWelcome
    );


    /* =========================================================
       BIENVENIDA -> INTRO
       ========================================================= */

    async function startFromWelcome() {

        await unlockVoice();


        mode =
            "intro";


        introRunId++;


        const runId =
            introRunId;


        resetIntroVisuals();


        welcome.classList.add(
            "valu-welcome-leaving"
        );


        setTimeout(
            function () {

                if (
                    mode !==
                        "intro" ||
                    introRunId !==
                        runId
                ) {
                    return;
                }


                welcome.hidden =
                    true;


                welcome.classList.remove(
                    "valu-welcome-leaving"
                );


                intro.hidden =
                    false;


                playIntro(
                    runId
                );

            },
            300
        );

    }


    welcomeStart.addEventListener(
        "click",
        startFromWelcome
    );


    /* =========================================================
       DEBUG / VERIFICACIÓN
       =========================================================

       No afecta al usuario.
       Permite comprobar desde consola que los seis pasos
       encuentran elementos reales.
    */

    window.ValuGuide =
        {

            debugResolveAll:
                function () {

                    if (
                        !peritoDocument ||
                        !peritoWindow
                    ) {

                        return {
                            ok:
                                false,

                            error:
                                "Perito Virtual aún no está listo."
                        };

                    }


                    const results =
                        tutorialSteps.map(
                            step => {

                                const resolved =
                                    resolveStepElements(
                                        step
                                    );


                                return {
                                    label:
                                        step.label,

                                    found:
                                        Boolean(
                                            resolved &&
                                            resolved.elements.length
                                        ),

                                    elements:
                                        resolved
                                            ?
                                            resolved.elements.length
                                            :
                                            0,

                                    actions:
                                        resolved
                                            ?
                                            resolved.actionElements.length
                                            :
                                            0
                                };

                            }
                        );


                    return {
                        ok:
                            results.every(
                                item =>
                                    item.found
                            ),

                        results:
                            results
                    };

                },

            goToStep:
                function (
                    index
                ) {

                    tourRunId++;


                    return showReviewStep(
                        Number(
                            index
                        )
                    );

                }

        };


    /* =========================================================
       ESTADO INICIAL
       ========================================================= */

    intro.hidden =
        true;

    peritoStage.hidden =
        true;

    welcome.hidden =
        false;


    resetIntroVisuals();

    showHead(
        "c1"
    );

})();
</script>
